<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B9770E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87560A;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#dots)"/>
  <text x="300" y="195" font-size="110" text-anchor="middle" dominant-baseline="middle">🌭</text>
  <text x="300" y="310" font-family="Georgia, serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="rgba(255,255,255,0.9)" letter-spacing="1">Wurstel</text>
</svg>
